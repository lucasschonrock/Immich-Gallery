name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
    types:
      - closed

permissions:
  contents: write

jobs:
  publish:
    name: Publish release notes
    if: ${{ github.event_name == 'push' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Release v')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Build release notes
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          release_file="Shared/releases.json"
          version="$(jq -er '.[0].version | select(type == "string" and length > 0)' "$release_file")"
          expected_tag="v${version}"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_TITLE" =~ ^Release\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              tag_name="v${BASH_REMATCH[1]}"
            else
              echo "::error::Release PR title must exactly match 'Release vX.Y.Z'."
              exit 1
            fi
          else
            tag_name="$REF_NAME"
          fi

          if [[ "$tag_name" != "$expected_tag" ]]; then
            echo "::error::Tag ${tag_name} does not match the latest release version ${expected_tag}."
            exit 1
          fi

          project_versions="$(
            awk -F ' = |;' '/MARKETING_VERSION =/ && $2 != "1.0" { print $2 }' \
              "Immich Gallery.xcodeproj/project.pbxproj" \
              | sort -u
          )"
          if [[ "$project_versions" != "$version" ]]; then
            echo "::error::Xcode marketing version '${project_versions}' does not match releases.json version '${version}'."
            exit 1
          fi

          notes_file="${RUNNER_TEMP}/release-notes.md"
          jq -er '
            .[0]
            | select(.changes | type == "array" and length > 0)
            | "# Immich Gallery " + .version + "\n\n"
              + (
                  .changes
                  | map(
                      "## " + .title + "\n\n"
                      + (.items | map("- " + .) | join("\n"))
                    )
                  | join("\n\n")
                )
          ' "$release_file" > "$notes_file"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Tag merged release
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          existing_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" \
              --jq '.object.sha' 2>/dev/null \
              || true
          )"

          if [[ -n "$existing_sha" ]]; then
            if [[ "$existing_sha" != "$MERGE_SHA" ]]; then
              echo "::error::Tag ${TAG_NAME} already points to ${existing_sha}, not merge commit ${MERGE_SHA}."
              exit 1
            fi
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              --field ref="refs/tags/${TAG_NAME}" \
              --field sha="$MERGE_SHA"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --title "Immich Gallery ${VERSION}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "Immich Gallery ${VERSION}" \
              --notes-file "$NOTES_FILE"
          fi
