name: Unit Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "Immich Gallery.xcodeproj" \
            -scheme "Immich Gallery" \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
            -only-testing:"Immich GalleryTests"
