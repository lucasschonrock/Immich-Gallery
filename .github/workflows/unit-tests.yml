name: Unit Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "Immich Gallery.xcodeproj" \
            -scheme "Immich Gallery" \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
            -only-testing:"Immich GalleryTests"
